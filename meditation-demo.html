<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>蛙蛙冥想會・展示</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#070A14;color:#E9E4D7;overflow:hidden;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#space{position:fixed;inset:0;z-index:0}
.glow{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:1;
  width:120vmin;height:120vmin;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(143,199,154,.14) 0%,rgba(199,162,75,.07) 38%,transparent 65%)}
.app{position:relative;z-index:2;height:100dvh;max-width:430px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;
  padding:max(1rem,env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom))}
.chip{font-size:.68rem;letter-spacing:.18em;color:#C7A24B;border:1px solid rgba(199,162,75,.45);
  border-radius:999px;padding:.16rem .8rem;margin-bottom:.4rem}
h1{font-size:1.35rem;letter-spacing:.3em;color:#F2EDE0;margin:.1rem 0 .1rem;text-indent:.3em}
.sub{color:#A9A694;font-size:.8rem;margin-bottom:.4rem}
/* 舞台 */
.stage{position:relative;width:100%;flex:1;min-height:0}
.meditator{position:absolute;display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-50%)}
.meditator img{display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.m-guru{left:50%;top:40%}
.m-guru img{width:min(46vw,190px)}
.m-a{left:18%;top:72%}.m-b{left:82%;top:72%}.m-c{left:50%;top:86%}
.m-a img,.m-b img{width:min(26vw,104px)}
.m-c img{width:min(28vw,112px)}
.float{animation:bob 4.2s ease-in-out infinite}
.m-a .float{animation-duration:4.8s;animation-delay:-1.2s}
.m-b .float{animation-duration:5.3s;animation-delay:-2.4s}
.m-c .float{animation-duration:4.5s;animation-delay:-.7s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* 浮空光暈（腳下的光，跟著浮動呼吸） */
.halo{width:62%;height:12px;border-radius:50%;margin-top:-4px;
  background:radial-gradient(ellipse,rgba(143,199,154,.5),transparent 70%);
  animation:haloB 4.2s ease-in-out infinite}
@keyframes haloB{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(.72);opacity:.4}}
.m-a .halo{animation-duration:4.8s;animation-delay:-1.2s}
.m-b .halo{animation-duration:5.3s;animation-delay:-2.4s}
.m-c .halo{animation-duration:4.5s;animation-delay:-.7s}
.tag{font-size:.7rem;color:#A9A694;letter-spacing:.1em;margin-top:.3rem;white-space:nowrap}
.tag b{color:#C7A24B}
/* 教主呼吸環 */
.ring{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  width:min(62vw,255px);height:min(62vw,255px);border-radius:50%;pointer-events:none;
  border:1.5px solid rgba(143,199,154,.5);
  animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:translate(-50%,-50%) scale(.86);opacity:.35}
  50%{transform:translate(-50%,-50%) scale(1.06);opacity:.85}}
/* 呱泡泡 */
.gua{position:absolute;font-size:.82rem;color:#8FC79A;opacity:0;pointer-events:none;
  background:rgba(8,20,12,.72);border:1px solid rgba(143,199,154,.5);
  border-radius:999px;padding:.1rem .6rem}
.gua.show{animation:guaUp 2.6s ease-out forwards}
@keyframes guaUp{0%{opacity:0;transform:translateY(6px)}18%{opacity:1}
  100%{opacity:0;transform:translateY(-34px)}}
/* 底部面板 */
.panel{position:relative;z-index:3;width:100%;text-align:center;
  background:rgba(8,11,24,.78);border:1px solid rgba(199,162,75,.3);
  border-radius:16px;padding:.8rem 1rem;backdrop-filter:blur(4px)}
.breath-txt{font-size:1.02rem;color:#8FC79A;letter-spacing:.35em;min-height:1.6em;text-indent:.35em}
.cnt{font-size:.8rem;color:#A9A694;min-height:1.3em}
.btn{display:inline-block;border:0;border-radius:999px;padding:.72rem 2rem;font:inherit;
  font-size:1rem;font-weight:700;letter-spacing:.2em;color:#0C0F1C;background:#C7A24B;
  cursor:pointer;margin-top:.45rem;text-indent:.2em}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4}
/* 戳章卡 */
.ovl{position:fixed;inset:0;z-index:9;background:rgba(2,3,10,.84);
  display:flex;align-items:center;justify-content:center;padding:1.4rem;
  opacity:0;pointer-events:none;transition:opacity .45s}
.ovl.on{opacity:1;pointer-events:auto}
.card{max-width:340px;width:100%;text-align:center;background:rgba(10,14,28,.97);
  border:1.5px solid rgba(199,162,75,.55);border-radius:18px;padding:1.5rem 1.3rem}
.stamp{width:168px;height:168px;margin:0 auto .6rem;border-radius:50%;position:relative;
  border:4px double #8FC79A;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#8FC79A;transform:rotate(-8deg) scale(3);opacity:0}
.ovl.on .stamp{animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) .25s forwards}
@keyframes stampIn{to{transform:rotate(-8deg) scale(1);opacity:1}}
.stamp img{width:74px;filter:grayscale(.2) sepia(.3) hue-rotate(60deg) saturate(.9)}
.stamp .s1{font-size:.92rem;font-weight:800;letter-spacing:.22em;text-indent:.22em}
.stamp .s2{font-size:.62rem;letter-spacing:.12em;color:#7FAE8A}
.card h3{color:#F2EDE0;margin:.3rem 0 .2rem;font-size:1.1rem;letter-spacing:.1em}
.card p{color:#A9A694;font-size:.86rem;margin:.2rem 0 .8rem;line-height:1.7}
@media (prefers-reduced-motion: reduce){
  .float,.halo,.ring{animation:none}
  .ovl.on .stamp{animation:none;transform:rotate(-8deg);opacity:1}
}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="glow"></div>
<div class="app">
  <div class="chip">下課休息模式・交誼廳｜期間限定</div>
  <h1>蛙 蛙 冥 想 會</h1>
  <div class="sub">本週教主：藍老爺樹蛙｜冥想中的夥伴一律浮空</div>

  <div class="stage" id="stage">
    <div class="ring"></div>
    <div class="meditator m-guru">
      <div class="float"><img src="assets/med-frog.webp" alt="藍老爺樹蛙"></div>
      <div class="halo"></div>
      <div class="tag"><b>教主</b>・藍老爺樹蛙</div>
    </div>
    <div class="meditator m-a">
      <div class="float"><img src="assets/med-cat.webp" alt="黑貓"></div>
      <div class="halo"></div>
      <div class="tag">夜巡的黑貓</div>
    </div>
    <div class="meditator m-b">
      <div class="float"><img src="assets/med-quokka.webp" alt="短尾矮袋鼠"></div>
      <div class="halo"></div>
      <div class="tag">微笑大使</div>
    </div>
    <div class="meditator m-c" id="me" style="opacity:.35">
      <div class="float"><img src="assets/med-rabbit.webp" alt="你的角色"></div>
      <div class="halo"></div>
      <div class="tag" id="me-tag">你的角色（未入座）</div>
    </div>
  </div>

  <div class="panel">
    <div class="breath-txt" id="breath">呱——歡迎來到冥想會</div>
    <div class="cnt" id="cnt">加入後靜坐 10 秒，可獲得期間限定戳章</div>
    <button class="btn" id="join">加 入 靜 坐</button>
  </div>
</div>

<!-- 戳章卡 -->
<div class="ovl" id="ovl">
  <div class="card">
    <div class="stamp">
      <img src="assets/med-frog.webp" alt="">
      <div class="s1">蛙蛙冥想會</div>
      <div class="s2" id="stamp-date">—</div>
    </div>
    <h3>限定戳章入手！</h3>
    <p>呱——心靜了。<br>這枚戳章已蓋進你的航行戳章本（期間限定，過期絕版）。</p>
    <button class="btn" id="again">再 靜 坐 一 次</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 星空 */
var cv=$('space'),cx=cv.getContext('2d'),stars=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;stars=[];
  for(var i=0;i<110;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:Math.random()*1.5+.3,p:Math.random()*Math.PI*2});}
addEventListener('resize',size);size();
(function frame(t){
  cx.fillStyle='#070A14';cx.fillRect(0,0,cv.width,cv.height);
  stars.forEach(function(s){var a=reduce?.5:(.28+.42*Math.abs(Math.sin(t/2000+s.p)));
    cx.globalAlpha=a;cx.fillStyle='#E9E4D7';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()});
  cx.globalAlpha=1;
  if(!reduce)requestAnimationFrame(frame);
})(0);

/* 呱泡泡（偶發、鬧中帶萌） */
function gua(){
  if(document.hidden)return;
  var g=document.createElement('div');g.className='gua show';
  g.textContent=['呱……','呱～','（小聲）呱'][Math.floor(Math.random()*3)];
  var guru=document.querySelector('.m-guru');
  g.style.left='calc(50% + '+(Math.random()*60-30)+'px)';
  g.style.top='26%';
  $('stage').appendChild(g);
  setTimeout(function(){g.remove()},2700);
}
if(!reduce)setInterval(gua,5200);

/* 靜坐 10 秒 */
var sitting=false;
var BRE=['吸 氣 …','吐 氣 …'];
$('join').addEventListener('click',function(){
  if(sitting)return;sitting=true;
  $('join').disabled=true;
  $('me').style.opacity='1';
  $('me-tag').innerHTML='<b>你的角色</b>・靜坐中';
  var left=10;
  $('cnt').textContent='靜坐中…… '+left+' 秒';
  $('breath').textContent=BRE[0];
  var bi=0;
  var bTimer=setInterval(function(){bi=1-bi;$('breath').textContent=BRE[bi]},2000);
  var timer=setInterval(function(){
    left--;
    if(left>0){$('cnt').textContent='靜坐中…… '+left+' 秒';return}
    clearInterval(timer);clearInterval(bTimer);
    $('breath').textContent='呱——心靜了';
    $('cnt').textContent='';
    var d=new Date();
    $('stamp-date').textContent=d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+'・期間限定';
    $('ovl').classList.add('on');
  },1000);
});
$('again').addEventListener('click',function(){
  $('ovl').classList.remove('on');
  sitting=false;$('join').disabled=false;
  $('breath').textContent='呱——歡迎回來';
  $('cnt').textContent='加入後靜坐 10 秒，可獲得期間限定戳章';
  $('me-tag').innerHTML='<b>你的角色</b>・休息中';
});
})();
</script>
</body>
</html>
