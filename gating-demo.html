<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>回合門控・展示</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#070A14;color:#E9E4D7;overflow:hidden;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7}
#space{position:fixed;inset:0;z-index:0}
.glow{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:1;
  width:130vmin;height:130vmin;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(199,162,75,.12) 0%,rgba(68,72,157,.06) 40%,transparent 66%)}
.app{position:relative;z-index:2;height:100dvh;max-width:430px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:max(1rem,env(safe-area-inset-top)) 1.2rem calc(1rem + env(safe-area-inset-bottom))}
.chip{font-size:.7rem;letter-spacing:.22em;color:#C7A24B;border:1px solid rgba(199,162,75,.45);
  border-radius:999px;padding:.16rem .85rem}
/* 鵂鶹本尊 */
.owl-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.owl-stage img{width:min(58vw,235px);
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));
  animation:hover 5s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.owl-halo{width:40%;height:14px;border-radius:50%;margin-top:2px;
  background:radial-gradient(ellipse,rgba(199,162,75,.45),transparent 70%);
  animation:haloB 5s ease-in-out infinite}
@keyframes haloB{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(.74);opacity:.4}}
/* 台詞字幕（無框） */
.who{margin-top:1rem;font-size:.72rem;letter-spacing:.35em;color:#C7A24B;text-indent:.35em}
.say{margin:.35rem 0 0;font-size:1.12rem;line-height:1.9;color:#F2EDE0;
  letter-spacing:.04em;text-wrap:balance;min-height:4.2em;
  font-family:"Songti TC","Noto Serif TC",serif}
.say.fade{animation:sayIn .6s ease}
@keyframes sayIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* 出發按鈕 */
.go{display:block;width:100%;border:0;border-radius:999px;padding:.95rem 1rem;
  font:inherit;font-size:1.05rem;font-weight:800;letter-spacing:.18em;text-indent:.18em;
  cursor:pointer;transition:background .5s,color .5s}
.go.locked{background:rgba(90,93,104,.32);color:#8E9094;border:1.5px solid rgba(142,144,148,.4);
  cursor:default;animation:wait 2.6s ease-in-out infinite}
@keyframes wait{0%,100%{box-shadow:0 0 0 0 rgba(142,144,148,0)}
  50%{box-shadow:0 0 0 6px rgba(142,144,148,.12)}}
.go.open{background:#C7A24B;color:#0C0F1C;animation:ignite .7s cubic-bezier(.2,1.3,.4,1);
  box-shadow:0 0 22px rgba(199,162,75,.4)}
@keyframes ignite{0%{transform:scale(.96);box-shadow:0 0 0 0 rgba(199,162,75,.7)}
  60%{transform:scale(1.03)}100%{transform:scale(1)}}
.dots{color:#8E9094;font-size:.78rem;letter-spacing:.2em;margin-top:.55rem;min-height:1.2em}
.dots i{font-style:normal;animation:blink 1.8s infinite}
.dots i:nth-child(2){animation-delay:.3s}.dots i:nth-child(3){animation-delay:.6s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
/* 模擬控制 */
.simbar{margin-top:.9rem;width:100%}
.simbar .note{font-size:.7rem;color:#A9A694;margin-bottom:.35rem;letter-spacing:.1em}
.simbtn{border:1px dashed rgba(143,199,154,.6);background:rgba(8,20,12,.6);color:#8FC79A;
  border-radius:999px;padding:.5rem 1.3rem;font:inherit;font-size:.85rem;cursor:pointer;letter-spacing:.08em}
@media (prefers-reduced-motion: reduce){
  .owl-stage img,.owl-halo,.go.locked,.dots i{animation:none}
  .go.open{animation:none}.say.fade{animation:none}}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="glow"></div>
<div class="app">
  <div class="chip">第 3 週・沉默星球｜待命中</div>

  <div class="owl-stage">
    <img src="assets/npc-owlet.webp" alt="鵂鶹・指揮官">
    <div class="owl-halo"></div>
    <div class="who">鵂 鶹 ・ 指 揮 官</div>
    <p class="say" id="say">「指揮官還在簡報——<br>先聽課，馬上就輪到你出場。」</p>
  </div>

  <button class="go locked" id="go" disabled>🔒 等待指揮官開放回合二</button>
  <div class="dots" id="dots">與艦橋保持通訊中<i>・</i><i>・</i><i>・</i></div>

  <div class="simbar">
    <div class="note">—— 展示用模擬器（正式版由艦橋遙控） ——</div>
    <button class="simbtn" id="sim">模擬：指揮官按下「開放回合二」</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var cv=$('space'),cx=cv.getContext('2d'),stars=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;stars=[];
  for(var i=0;i<110;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:Math.random()*1.5+.3,p:Math.random()*Math.PI*2});}
addEventListener('resize',size);size();
(function frame(t){
  cx.fillStyle='#070A14';cx.fillRect(0,0,cv.width,cv.height);
  stars.forEach(function(s){var a=reduce?.5:(.28+.42*Math.abs(Math.sin(t/2000+s.p)));
    cx.globalAlpha=a;cx.fillStyle='#E9E4D7';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()});
  cx.globalAlpha=1;
  if(!reduce)requestAnimationFrame(frame);
})(0);

function saySet(html){
  var s=$('say');s.classList.remove('fade');void s.offsetWidth;
  s.innerHTML=html;s.classList.add('fade');
}
var open=false;
$('sim').addEventListener('click',function(){
  open=!open;
  var go=$('go');
  if(open){
    go.classList.remove('locked');go.classList.add('open');go.disabled=false;
    go.textContent='出 發 航 行（回 合 二）';
    saySet('「回合二開放——<br>引航員，出發！」');
    $('dots').textContent='';
    $('sim').textContent='模擬：指揮官關閉回合（回到等待）';
  }else{
    go.classList.remove('open');go.classList.add('locked');go.disabled=true;
    go.innerHTML='🔒 等待指揮官開放回合二';
    saySet('「指揮官還在簡報——<br>先聽課，馬上就輪到你出場。」');
    $('dots').innerHTML='與艦橋保持通訊中<i>・</i><i>・</i><i>・</i>';
    $('sim').textContent='模擬：指揮官按下「開放回合二」';
  }
});
})();
</script>
</body>
</html>
